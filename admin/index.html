<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>内容管理 — Nooj Log</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FAF9F5">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="app/vendor/vditor/dist/index.css">
  <script>
    /* 主题跟随前台的同一份记忆，避免后台与站点一明一暗 */
    (function () {
      try {
        var t = localStorage.getItem("nooj-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <style>
    /* 首屏骨架：模块与编辑器资源就绪前的一层薄幕 */
    #boot {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: var(--bg);
      transition: opacity 240ms var(--ease-out);
    }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot .mark {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--accent); display: grid; place-items: center;
    }
    #boot .name { font-family: var(--font-serif); font-size: 1rem; color: var(--ink); }
    #boot .dots { display: flex; gap: 5px; }
    #boot .dots i {
      width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
      animation: bp 1.2s var(--ease-out) infinite;
    }
    #boot .dots i:nth-child(2) { animation-delay: .15s; }
    #boot .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes bp { 0%,100% { opacity: .22; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <div id="boot">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 28 28" width="26" height="26">
        <path d="M8 19.5 L14 8.5 L20 19.5" fill="none" stroke="#FAF9F5" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2.6 3.4"/>
        <circle cx="8" cy="19.5" r="2.1" fill="#FAF9F5"/>
        <circle cx="14" cy="8.5" r="2.1" fill="#FAF9F5"/>
        <circle cx="20" cy="19.5" r="2.1" fill="#FAF9F5"/>
      </svg>
    </div>
    <p class="name">Nooj Log</p>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>

  <noscript>
    <p style="padding:24px;font-family:sans-serif">后台需要 JavaScript，请在浏览器中启用后刷新。</p>
  </noscript>

  <!-- 编辑器内核与 HTML→Markdown 兜底转换（本地自带，不依赖 CDN） -->
  <script src="app/vendor/vditor/dist/index.min.js"></script>
  <script src="app/vendor/turndown/turndown.js"></script>

  <script type="module" src="js/app.js"></script>
  <script>
    /* 应用挂载后撤幕；8 秒兜底，绝不永久遮挡 */
    (function () {
      var boot = document.getElementById("boot");
      var hide = function () {
        if (!boot) return;
        boot.classList.add("done");
        setTimeout(function () { boot.remove(); }, 260);
      };
      var check = function () {
        var root = document.getElementById("root");
        if (root && root.children.length) hide();
      };
      if ("MutationObserver" in window) {
        new MutationObserver(check).observe(document.getElementById("root"), { childList: true });
      }
      check();
      setTimeout(hide, 8000);
    })();
  </script>
</body>
</html>
